info.app:
  name: Nomis Mapping Service
  version: 1.0

spring:
  application:
    name: hmpps-nomis-mapping-service
  http:
    codecs:
      max-in-memory-size: 10MB

  profiles:
    group:
      test:
        - "stdout"
      dev:
        - "stdout"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${api.base.url.hmpps-auth}/.well-known/jwks.json

  flyway:
    enabled: true
    url: jdbc:postgresql://${DATABASE_ENDPOINT}/${DATABASE_NAME}?sslmode=verify-full

  data:
    web:
      pageable:
        max-page-size: 20000

  r2dbc:
    url: r2dbc:postgresql://${DATABASE_ENDPOINT}/${DATABASE_NAME}
    pool:
      max-life-time: -1
    properties:
      ssl: true
      sslRootCert: /home/appuser/.postgresql/root.crt
  web:
    error:
      include-message: always

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

casenotes.average-case-notes-per-prisoner: 134
csras.average-per-prisoner: 4
transactions.average-transactions-per-prisoner: 850

visit-balance-adjustment.expiry:
  days: 28
  schedule:
    cron: "0 0 2 * * *"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    version: 5.32.11
  model-converters:
    kotlin-nullable-property-customizer:
      enabled: false
